name: Publish download pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'site.css', 'capture/**', 'text2speech/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare app pages
        run: |
          mkdir -p page/capture page/text2speech
          cp index.html page/index.html
          cp site.css page/site.css
          cp -R capture/. page/capture/
          cp -R text2speech/. page/text2speech/
          touch page/.nojekyll

      - name: Refresh Capture release catalog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const allReleases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: "OathPros", repo: "Capture", per_page: 100 }
            );
            const releases = allReleases
              .filter(release => !release.draft)
              .map(release => {
                const version = release.tag_name.replace(/^v/, "");
                const installer = release.assets.find(
                  asset => asset.name === `YU-Capture-${version}-Setup-x64.exe`
                );
                if (!installer) return null;
                return { version, publishedAt: release.published_at };
              })
              .filter(Boolean)
              .sort((left, right) =>
                Date.parse(right.publishedAt) - Date.parse(left.publishedAt)
              );
            if (releases.length === 0) {
              core.setFailed("No Capture releases with installer assets were found.");
              return;
            }
            fs.writeFileSync(
              "page/capture/releases.json",
              JSON.stringify(releases, null, 2) + "\n"
            );

      - name: Refresh Text2Speech release catalog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const allReleases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: "OathPros", repo: "txt2speech", per_page: 100 }
            );
            const releases = allReleases
              .filter(release => !release.draft && !release.prerelease)
              .map(release => {
                const version = release.tag_name.replace(/^v/, "");
                const installerName = `Text2Speech-Setup-${version}.exe`;
                const installer = release.assets.find(asset => asset.name === installerName);
                if (!installer) return null;
                const checksum = release.assets.find(
                  asset => asset.name === `Text2Speech-Setup-${version}-SHA256.txt`
                );
                return {
                  version,
                  publishedAt: release.published_at,
                  releaseUrl: release.html_url,
                  downloadUrl: installer.browser_download_url,
                  sizeBytes: installer.size,
                  checksumUrl: checksum ? checksum.browser_download_url : null
                };
              })
              .filter(Boolean)
              .sort((left, right) =>
                Date.parse(right.publishedAt) - Date.parse(left.publishedAt)
              );
            if (releases.length === 0) {
              core.setFailed("No stable Text2Speech releases with installer assets were found.");
              return;
            }
            fs.writeFileSync(
              "page/text2speech/releases.json",
              JSON.stringify(releases, null, 2) + "\n"
            );

      - uses: actions/upload-pages-artifact@v3
        with:
          path: page
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
