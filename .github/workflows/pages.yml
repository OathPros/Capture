name: Publish download pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'capture/**', 'text2speech/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare app pages
        run: |
          mkdir -p page/capture page/text2speech
          cp index.html page/index.html
          cp -R capture/. page/capture/
          cp -R text2speech/. page/text2speech/
          touch page/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: page
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
