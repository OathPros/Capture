name: Build Windows preview
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/capture-editor/package-lock.json
      - name: Build native app and bundled editor
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Run core and browser tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package self-contained Windows x64 app
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify package contents
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Capture-Windows-x64-preview
          path: artifacts/Capture-0.1.0-preview.1-win-x64.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Capture-Windows-x64-preview
          path: artifacts
      - name: Publish tested build as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip --prerelease --title "CAPTURE 0.1.0 — Windows preview" --notes-file docs/RELEASE-NOTES.md
